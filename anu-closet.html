<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Anu Closet - Connect With Us</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: linear-gradient(180deg, #EDE4D3 0%, #F4ECDD 35%, #F4ECDD 100%);
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 22px 20px 50px;
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif;
    }

    /* Main white card */
    .card {
      width: 100%;
      max-width: 420px;
      background-color: #FDFBF7;
      border: 1.5px solid #E4DACB;
      border-radius: 36px;
      padding: 32px 20px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 18px 40px rgba(120, 95, 60, 0.18), 0 2px 6px rgba(120, 95, 60, 0.08);
    }

    /* Round logo */
    .logo-circle {
      width: 176px;
      height: 176px;
      border-radius: 50%;
      border: 2px solid #DCD0BB;
      background-color: #F3ECDD;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 22px rgba(120, 95, 60, 0.15);
      margin-bottom: 22px;
    }

    .logo-circle img {
      width: 94%;
      height: 94%;
      object-fit: contain;
      display: block;
    }

    .brand-name {
      font-family: Georgia, 'Times New Roman', Times, serif;
      font-size: 35px;
      font-weight: 400;
      color: #231F1B;
      text-align: center;
      letter-spacing: 0.2px;
      margin-bottom: 24px;
    }

    .buttons {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .btn {
      width: 100%;
      height: 62px;
      background-color: #A94F46;
      color: #FFFFFF;
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      text-decoration: none;
      font-size: 20px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      box-shadow: 0 3px 8px rgba(120, 50, 40, 0.18);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .btn:active,
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 7px 16px rgba(120, 50, 40, 0.28);
    }

    .btn svg {
      flex-shrink: 0;
      pointer-events: none;
    }
  </style>
</head>
